<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#132e36">
  <meta name="description" content="Källspårbar medlems- och båthistorik för Korpholmens Båtklubb">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="../icons/korpholmen-180.png">
  <link rel="stylesheet" href="./styles.css?v=2026-08-07-korpholmen-pwa-31">
  <link rel="stylesheet" href="./boat-reference.css?v=2026-08-07-korpholmen-pwa-31">
  <link rel="stylesheet" href="./matrix.css?v=2026-08-07-korpholmen-pwa-31">
  <link rel="stylesheet" href="../app-switcher.css?v=2026-08-07-korpholmen-pwa-31">
  <title>KBK Klubbhistorik – matriklar över tid</title>
</head>
<body class="app-klubbhistorik">
  <a class="skip-to-content" href="#app">Hoppa till innehåll</a>
  <nav class="app-switcher" aria-label="Byt app">
    <a class="app-switch" href="../">Korpholmen</a>
    <a class="app-switch" href="../matrikel/">01 Matrikel</a>
    <a class="app-switch" href="../batregister/">02 Båtregister</a>
    <a class="app-switch" href="../fastigheter/">03 Fastigheter</a>
    <a class="app-switch" href="../dokumentarkiv/">04 Dokumentarkiv</a>
    <a class="app-switch" href="../korpholmenrunt/">05 Korpholmen runt</a>
    <a class="app-switch" href="./" aria-current="page">06 Klubbhistorik</a>
    <a class="app-switch" href="../kartdata/">07 Kartdata</a>
  </nav>
  <script>requestAnimationFrame(() => document.querySelector('.app-switch[aria-current="page"]')?.scrollIntoView({ block: 'nearest', inline: 'center' }));</script>
  <header class="masthead">
    <div class="titel"><p>Korpholmens Båtklubb</p><h1>Klubbhistorik</h1><span>Matriklar · människor · båtar · förändringar</span></div>
    <div class="live"><span id="sync-status">Startar den lokala mastern…</span><button id="connect-dropbox" type="button">Anslut Dropbox</button></div>
  </header>

  <nav class="huvudnav" aria-label="Appens delar">
    <button class="aktiv" data-view="oversikt">Översikt</button>
    <button data-view="utgava">Matrikelutgåvor</button>
    <button data-view="matris">Medlemsmatris</button>
    <button data-view="forandringar">Förändringar</button>
    <button data-view="personer">Personhistorik</button>
    <button data-view="granskning">Granskning <b id="review-count">0</b></button>
  </nav>

  <section class="verktygsrad">
    <label class="sok"><span>⌕</span><input id="global-search" type="search" placeholder="Sök person, klubbnamn, båt eller år…"><button id="clear-search" type="button" aria-label="Rensa">×</button></label>
    <label class="utgaveval"><span>Utgåva</span><select id="release-filter" aria-label="Matrikelutgåva"></select></label>
    <button id="export-audit" class="sekundar" type="button">Exportera kontrollrapport</button>
  </section>

  <main id="app" tabindex="-1"></main>
  <script type="module" src="../src/app-family-bootstrap.js?v=2026-08-07-korpholmen-pwa-31"></script>
  <script type="module" src="./src/app.js?v=2026-08-07-korpholmen-pwa-31"></script>
</body>
</html>
