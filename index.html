<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#18392f">
  <meta name="description" content="Privat släkt- och ölandskap för Korpholmen">
  <title>Släktlandskap</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">Korpholmen</p>
      <h1>Släktlandskap</h1>
    </div>
    <div class="sync-panel">
      <span id="sync-status" role="status">Startar lokalt lager…</span>
      <button id="connect-dropbox" type="button">Anslut Dropbox</button>
    </div>
  </header>
  <main>
    <section class="toolbar" aria-label="Sök och lokal aktivering">
      <label>
        <span>Sök person</span>
        <input id="search" type="search" autocomplete="off" placeholder="Namn, klubbnamn eller namnform">
      </label>
      <button id="bootstrap-local" class="secondary" type="button" hidden>Aktivera godkänd startkopia</button>
    </section>
    <div id="content" aria-live="polite"></div>
  </main>
  <script type="module" src="./src/app.js?v=2026-08-01-4"></script>
</body>
</html>
